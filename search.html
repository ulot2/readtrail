<!doctype html>
<meta charset="utf-8" />
<title>Archive</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #fff; --panel: #f6f6f8; --fg: #16161a; --muted: #6b6b76; --line: #e4e4e9;
    --hover: #f0f0f4; --chip: #eceef3; --brand: #16305e; --accent: #0b57d0;
    --focus: #0b57d0; --mark: #fde68a; --mark-fg: #16161a; --danger: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141417; --panel: #1a1a1f; --fg: #e9e9ee; --muted: #9a9aa5; --line: #2a2a31;
      --hover: #212127; --chip: #26262d; --brand: #a3bdfa; --accent: #8ab4f8;
      --focus: #8ab4f8; --mark: #6b5510; --mark-fg: #fff6d8; --danger: #f2b8b5;
    }
  }

  * { box-sizing: border-box; }
  /* A class that sets display would otherwise beat the hidden attribute. */
  [hidden] { display: none !important; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  button, input, select, textarea { font: inherit; color: inherit; }
  img { display: block; }

  /* Two panes. Each scrolls on its own, so the sidebar never leaves. */
  .app { display: grid; grid-template-columns: 260px minmax(0, 1fr); height: 100vh; }
  .side {
    display: flex; flex-direction: column; overflow-y: auto;
    background: var(--panel); border-right: 1px solid var(--line);
  }
  .main { overflow-y: auto; padding: 32px 40px 96px; }
  .main > * { max-width: 760px; }

  /* Sidebar */
  .brand {
    display: flex; align-items: center; gap: 10px; padding: 20px 20px 6px;
    font-weight: 650; font-size: 16px; letter-spacing: -0.01em;
  }
  .brand img { border-radius: 6px; }
  .stats { padding: 0 20px 18px; color: var(--muted); font-size: 13px; }
  .stats strong { color: var(--fg); font-weight: 600; font-variant-numeric: tabular-nums; }

  .sites { display: flex; flex-direction: column; gap: 1px; padding: 0 10px; }
  .sites-title {
    padding: 0 10px 6px; color: var(--muted); font-size: 11px;
    font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
  }
  .site {
    display: flex; align-items: center; gap: 9px; width: 100%; padding: 6px 10px;
    border: 0; border-radius: 8px; background: none; text-align: left; cursor: pointer;
  }
  .site:hover { background: var(--hover); }
  .site[aria-current="true"] { background: var(--bg); box-shadow: 0 0 0 1px var(--line); font-weight: 600; }
  .site-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13.5px; }
  .site-count { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }

  .side-foot {
    margin-top: auto; padding: 16px 20px 20px; border-top: 1px solid var(--line);
    display: flex; flex-direction: column; gap: 12px;
  }
  .switch { display: flex; align-items: center; gap: 8px; font-size: 13.5px; cursor: pointer; }

  /* Buttons */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    padding: 7px 12px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--bg); cursor: pointer; font-size: 13.5px;
  }
  .btn:hover { background: var(--hover); }
  .btn-danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 40%, var(--line)); }

  /* Search */
  .search { position: relative; display: flex; gap: 10px; }
  .search svg {
    position: absolute; left: 15px; top: 50%; width: 18px; height: 18px;
    transform: translateY(-50%); color: var(--muted); pointer-events: none;
  }
  #q {
    flex: 1; min-width: 0; padding: 12px 14px 12px 44px; font-size: 17px;
    border: 1px solid var(--line); border-radius: 12px; background: var(--bg);
  }
  #q::placeholder { color: var(--muted); }
  #since {
    padding: 0 12px; border: 1px solid var(--line); border-radius: 12px;
    background: var(--bg); font-size: 13.5px;
  }

  .filter {
    display: inline-flex; align-items: center; gap: 8px; margin-top: 12px;
    padding: 4px 6px 4px 12px; border-radius: 999px; background: var(--chip); font-size: 13px;
  }
  .filter button {
    width: 22px; height: 22px; border: 0; border-radius: 50%; background: none;
    cursor: pointer; color: var(--muted); font-size: 16px; line-height: 1;
  }
  .filter button:hover { background: var(--hover); color: var(--fg); }

  #status { margin: 20px 0 6px; color: var(--muted); font-size: 13px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 8px; }
  .chip {
    padding: 3px 10px; border: 0; border-radius: 999px; background: var(--chip);
    font-size: 12.5px; cursor: pointer;
  }
  .chip:hover { background: var(--hover); }

  /* Results */
  .results { list-style: none; margin: 0; padding: 0; }
  .hit { position: relative; padding: 16px 14px; margin: 0 -14px; border-radius: 12px; }
  .hit:hover, .hit:focus-within { background: var(--hover); }
  .hit + .hit::before {
    content: ""; position: absolute; left: 14px; right: 14px; top: 0;
    border-top: 1px solid var(--line);
  }
  .hit:hover + .hit::before, .hit:focus-within + .hit::before { border-color: transparent; }
  .hit-meta {
    display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12.5px;
    font-variant-numeric: tabular-nums;
  }
  .favicon { width: 16px; height: 16px; border-radius: 3px; flex: none; }
  .hit-title {
    display: block; margin-top: 4px; color: var(--accent); font-size: 16.5px;
    font-weight: 600; text-decoration: none; letter-spacing: -0.005em;
  }
  .hit-title:hover { text-decoration: underline; }
  .hit-excerpt {
    margin: 6px 0 0; font-size: 14.5px; color: var(--fg);
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  mark { background: var(--mark); color: var(--mark-fg); border-radius: 2px; padding: 0 1px; }

  /* Destructive actions stay out of the way until a row is hovered or focused.
     They remain in the tab order the whole time, so keyboard users find them. */
  .hit-actions { margin-left: auto; display: flex; gap: 10px; opacity: 0; transition: opacity 120ms; }
  .hit:hover .hit-actions, .hit:focus-within .hit-actions { opacity: 1; }
  .hit-actions button {
    border: 0; background: none; padding: 0; cursor: pointer;
    color: var(--muted); font-size: 12.5px;
  }
  .hit-actions button:hover { color: var(--danger); text-decoration: underline; }

  /* Empty states */
  .empty { padding: 56px 0 0; max-width: 520px; }
  .empty h2 { margin: 0 0 10px; font-size: 20px; letter-spacing: -0.01em; }
  .empty p { margin: 0 0 10px; color: var(--muted); }
  .empty ul { margin: 0 0 14px; padding-left: 20px; color: var(--muted); }
  .empty li { margin: 2px 0; }

  /* Settings */
  dialog {
    width: min(560px, calc(100vw - 32px)); padding: 0; border: 1px solid var(--line);
    border-radius: 14px; background: var(--bg); color: var(--fg);
    box-shadow: 0 24px 64px rgb(0 0 0 / 0.24);
  }
  dialog::backdrop { background: rgb(0 0 0 / 0.4); }
  .dialog-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 22px; border-bottom: 1px solid var(--line);
  }
  .dialog-head h2 { margin: 0; font-size: 17px; }
  dialog section { padding: 18px 22px; border-bottom: 1px solid var(--line); }
  dialog section:last-child { border-bottom: 0; }
  dialog h3 { margin: 0 0 4px; font-size: 14px; }
  .hint { margin: 0 0 10px; color: var(--muted); font-size: 13px; }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  textarea {
    width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--bg); resize: vertical; font-size: 13.5px;
  }
  #older { padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }

  /* Keeps the file input reachable by keyboard while the label does the looking. */
  .visually-hidden {
    position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
  .visually-hidden:focus-visible + .btn { outline: 2px solid var(--focus); outline-offset: 2px; }

  @media (max-width: 720px) {
    .app { grid-template-columns: 1fr; height: auto; }
    .side { border-right: 0; border-bottom: 1px solid var(--line); }
    .sites { flex-direction: row; flex-wrap: wrap; gap: 4px; padding: 0 16px 8px; }
    .site { width: auto; }
    .sites-title { width: 100%; }
    .side-foot { flex-direction: row; justify-content: space-between; align-items: center; }
    .main { padding: 24px 20px 64px; }
  }
</style>

<div class="app">
  <aside class="side">
    <div class="brand">
      <img src="icons/icon-32.png" alt="" width="24" height="24" />
      <span>Archive</span>
    </div>
    <div class="stats" id="stats"></div>

    <nav class="sites" aria-label="Sites">
      <div class="sites-title">Sites</div>
      <button type="button" class="site" data-host="" aria-current="true">
        <span class="site-name">All sites</span>
        <span class="site-count" id="allCount"></span>
      </button>
      <div id="siteList" style="display: contents"></div>
    </nav>

    <div class="side-foot">
      <label class="switch"><input type="checkbox" id="pause" /> Pause archiving</label>
      <button id="settingsBtn" type="button" class="btn">Settings</button>
    </div>
  </aside>

  <main class="main">
    <div class="search" role="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" />
      </svg>
      <input id="q" type="search" autocomplete="off" autofocus
             placeholder="Search everything you have read" aria-label="Search the archive" />
      <select id="since" aria-label="Time range">
        <option value="0">Any time</option>
        <option value="1">Today</option>
        <option value="7">Last 7 days</option>
        <option value="30">Last 30 days</option>
        <option value="365">Last year</option>
      </select>
    </div>

    <div id="filter" class="filter" hidden>
      in <strong id="filterHost"></strong>
      <button id="clearFilter" type="button" aria-label="Show all sites">&times;</button>
    </div>

    <p id="status" role="status" aria-live="polite">Loading...</p>
    <div id="related" class="chips" hidden></div>
    <ol id="results" class="results"></ol>
    <div id="empty" class="empty" hidden></div>
  </main>
</div>

<dialog id="settings" aria-labelledby="settingsTitle">
  <div class="dialog-head">
    <h2 id="settingsTitle">Settings</h2>
    <button id="closeSettings" type="button" class="btn">Close</button>
  </div>

  <section>
    <h3>Sites never archived</h3>
    <p class="hint">One per line. Blocking a site blocks everything under it.</p>
    <textarea id="deny" rows="4" spellcheck="false"
              placeholder="mybank.com&#10;mail.google.com"></textarea>
  </section>

  <section>
    <h3>Your data</h3>
    <p class="hint">
      Export writes one line of JSON per page. Import merges by address and never
      overwrites newer reading.
    </p>
    <div class="row">
      <button id="exportBtn" type="button" class="btn">Export archive</button>
      <input type="file" id="importFile" class="visually-hidden" accept=".ndjson,.jsonl,.json" />
      <label for="importFile" class="btn">Import a file</label>
    </div>
  </section>

  <section>
    <h3>Delete by age</h3>
    <div class="row">
      <label for="older">Delete every page older than</label>
      <select id="older">
        <option value="30">30 days</option>
        <option value="90">90 days</option>
        <option value="365">1 year</option>
      </select>
      <button id="purge" type="button" class="btn btn-danger">Delete</button>
    </div>
  </section>
</dialog>

<script type="module" src="search.js"></script>
