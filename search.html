<!doctype html>
<meta charset="utf-8" />
<title>Archive</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #fff; --fg: #16161a; --muted: #6b6b76; --line: #e6e6ea;
    --mark: #fde68a; --mark-fg: #16161a; --accent: #0b57d0; --focus: #0b57d0;
    --danger: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141417; --fg: #e9e9ee; --muted: #9a9aa5; --line: #2a2a31;
      --mark: #6b5510; --mark-fg: #fff6d8; --accent: #8ab4f8; --focus: #8ab4f8;
      --danger: #f2b8b5;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header {
    position: sticky; top: 0; background: var(--bg);
    border-bottom: 1px solid var(--line); padding: 20px 24px 14px;
  }
  .bar, details { max-width: 760px; margin: 0 auto; }
  .bar { display: flex; gap: 10px; }
  input, select {
    font: inherit; color: inherit; background: var(--bg);
    border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px;
  }
  input { flex: 1; }
  input:focus-visible, select:focus-visible, a:focus-visible, button:focus-visible {
    outline: 2px solid var(--focus); outline-offset: 2px;
  }
  details { margin-top: 12px; color: var(--muted); font-size: 13px; }
  summary { cursor: pointer; width: max-content; }
  .manage-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 10px; }
  .manage-row select { padding: 6px 8px; }
  .manage-row label { display: flex; align-items: center; gap: 6px; }
  textarea {
    font: inherit; color: inherit; background: var(--bg); width: 100%;
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
    margin-top: 6px; resize: vertical;
  }
  textarea:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  hr { border: 0; border-top: 1px solid var(--line); margin: 14px 0; }
  #purge, #exportBtn {
    font: inherit; color: inherit; background: var(--bg);
    border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; cursor: pointer;
  }
  #purge { color: var(--danger); }
  input[type="file"] { font: inherit; font-size: 13px; max-width: 100%; }
  main { max-width: 760px; margin: 0 auto; padding: 0 24px 64px; }
  #status { color: var(--muted); font-size: 13px; margin: 18px 0; }
  ol { list-style: none; margin: 0; padding: 0; }
  li { padding: 18px 0; border-bottom: 1px solid var(--line); }
  a { color: var(--accent); text-decoration: none; font-size: 16px; font-weight: 600; }
  a:hover { text-decoration: underline; }
  .meta { color: var(--muted); font-size: 12px; margin-top: 3px; }
  .meta button {
    font: inherit; color: var(--muted); background: none; border: 0;
    padding: 0; cursor: pointer; text-decoration: underline;
  }
  .meta button:hover { color: var(--danger); }
  p.excerpt { margin: 8px 0 0; }
  mark { background: var(--mark); color: var(--mark-fg); border-radius: 2px; }
</style>

<header>
  <div class="bar">
    <input id="q" type="search" autocomplete="off" autofocus
           placeholder="Search everything you have read" aria-label="Search the archive" />
    <select id="since" aria-label="Time range">
      <option value="0">Any time</option>
      <option value="1">Today</option>
      <option value="7">Last 7 days</option>
      <option value="30">Last 30 days</option>
      <option value="365">Last year</option>
    </select>
  </div>

  <details>
    <summary>Manage</summary>
    <div class="manage-row">
      <label><input type="checkbox" id="pause" /> Pause archiving</label>
    </div>

    <div class="manage-row">
      <label for="deny">Never archive these sites, one per line</label>
    </div>
    <textarea id="deny" rows="4" spellcheck="false"
              placeholder="mybank.com&#10;mail.google.com"></textarea>

    <hr />

    <div class="manage-row">
      <button id="exportBtn" type="button">Export archive</button>
      <label for="importFile">Import a file</label>
      <input type="file" id="importFile" accept=".ndjson,.jsonl,.json" />
    </div>

    <hr />

    <div class="manage-row">
      <label for="older">Delete every page older than</label>
      <select id="older">
        <option value="30">30 days</option>
        <option value="90">90 days</option>
        <option value="365">1 year</option>
      </select>
      <button id="purge" type="button">Delete</button>
    </div>
  </details>
</header>

<main>
  <p id="status" role="status" aria-live="polite">Loading...</p>
  <ol id="results"></ol>
</main>

<script type="module" src="search.js"></script>
